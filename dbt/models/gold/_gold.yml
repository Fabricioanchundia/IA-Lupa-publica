models:
  - name: indicator_r018_single_bid
    description: >
      R018 Single bid received (OCP Cardinal). One row per evaluated process
      (competitive method, awarded, number of bids known). A risk signal, not evidence
      of wrongdoing. See docs/indicators/r018-single-bid.md.
    columns:
      - name: ocid
        data_tests: [not_null, unique]
      - name: procurement_method
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('r018_procurement_methods') }}"
      - name: number_of_tenderers
        data_tests: [not_null, positive]
      - name: flagged
        data_tests: [not_null]

  - name: buyer_r018_summary
    description: >
      Single-bid rate per buyer, with the expected rate for the procedure types it uses.
      Only buyers with enough_data = true should be shown in rankings.
    columns:
      - name: buyer_id
        data_tests: [not_null, unique]
      - name: evaluated_processes
        data_tests: [not_null, positive]


  - name: indicator_r003_short_period
    description: >
      R003 Short submission period (OCP Cardinal). One row per evaluated process
      (competitive method, tender start and end known, procedure type with enough
      processes). A risk signal, not evidence of wrongdoing.
      See docs/indicators/r003-short-period.md.
    columns:
      - name: ocid
        data_tests: [not_null, unique]
      - name: procurement_method
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('r003_procurement_methods') }}"
      - name: tender_days
        data_tests: [not_null]
      - name: flagged
        data_tests: [not_null]

  - name: buyer_r003_summary
    description: >
      Short-period rate per buyer, with the expected rate for its procedure types
      (leave-one-out). Only buyers with enough_data = true should be ranked.
    columns:
      - name: buyer_id
        data_tests: [not_null, unique]
      - name: evaluated_processes
        data_tests: [not_null, positive]

unit_tests:
  - name: r018_buyers_are_compared_with_others_only
    description: >
      Leave-one-out baselines: each buyer's expected rate comes from OTHER buyers'
      processes of the same procedure type and CPC division, falling back to the
      procedure type when the CPC group is too small.
    model: buyer_r018_summary
    overrides:
      vars:
        r018_min_baseline: 2
        r018_min_processes: 1
    given:
      - input: ref('indicator_r018_single_bid')
        rows:
          # Buyer A: 2 processes in (Subasta, CPC 43), both single bid.
          - {buyer_id: A, buyer_name: A, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: true}
          - {buyer_id: A, buyer_name: A, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: true}
          # Buyer B: 4 processes in the same group, 1 single bid.
          - {buyer_id: B, buyer_name: B, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: true}
          - {buyer_id: B, buyer_name: B, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: false}
          - {buyer_id: B, buyer_name: B, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: false}
          - {buyer_id: B, buyer_name: B, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: false}
          # Buyer C: alone in (Subasta, CPC 28), so it falls back to the procedure type.
          - {buyer_id: C, buyer_name: C, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "28", flagged: false}
    expect:
      rows:
        # A vs B's group rate 1/4: expected 0.5, observed 2 -> 4x.
        - {buyer_id: A, single_bid_processes: 2, expected_rate: 0.25, observed_to_expected: 4.0, cpc_baseline_share: 1.0}
        # B vs A's group rate 2/2: expected 4, observed 1 -> 0.25x.
        - {buyer_id: B, single_bid_processes: 1, expected_rate: 1.0, observed_to_expected: 0.25, cpc_baseline_share: 1.0}
        # C: no other buyer in CPC 28 -> type rate from A and B, 3/6.
        - {buyer_id: C, single_bid_processes: 0, expected_rate: 0.5, observed_to_expected: 0.0, cpc_baseline_share: 0.0}

  - name: r003_days_are_complete_24h_periods_below_type_percentile
    description: >
      R003 counts complete 24-hour days (17:00 -> 10:00 four dates later is 3 days)
      and flags processes strictly below the percentile of their procedure type.
      Procedure types with too few processes are not evaluated.
    model: indicator_r003_short_period
    overrides:
      vars:
        r003_min_group: 4
        r003_percentile: 0.25
    given:
      - input: ref('processes')
        rows:
          - {ocid: a, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 17:00:00-05", tender_period_end: "2025-01-10 10:00:00-05"}
          - {ocid: b, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-16 09:00:00-05"}
          - {ocid: c, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-18 09:00:00-05"}
          - {ocid: d, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-20 09:00:00-05"}
          - {ocid: e, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-21 09:00:00-05"}
          # Only 1 process of this type: not evaluated.
          - {ocid: f, procurement_method: open, procurement_method_details: Cotización, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-07 09:00:00-05"}
          # Direct award: never evaluated.
          - {ocid: g, procurement_method: direct, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-07 09:00:00-05"}
    expect:
      rows:
        - {ocid: a, tender_days: 3, threshold_days: 10, flagged: true}
        - {ocid: b, tender_days: 10, threshold_days: 10, flagged: false}
        - {ocid: c, tender_days: 12, threshold_days: 10, flagged: false}
        - {ocid: d, tender_days: 14, threshold_days: 10, flagged: false}
        - {ocid: e, tender_days: 15, threshold_days: 10, flagged: false}
