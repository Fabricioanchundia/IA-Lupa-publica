models:
  - name: indicator_r018_single_bid
    description: >
      R018 Single bid received (OCP Cardinal). One row per evaluated process
      (competitive method, awarded, number of bids known). A risk signal, not evidence
      of wrongdoing. See docs/indicators/r018-single-bid.md.
    columns:
      - name: ocid
        data_tests: [not_null, unique]
      - name: procurement_method
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('r018_procurement_methods') }}"
      - name: number_of_tenderers
        data_tests: [not_null, positive]
      - name: flagged
        data_tests: [not_null]

  - name: buyer_r018_summary
    description: >
      Single-bid rate per buyer, with the expected rate for the procedure types it uses.
      Only buyers with enough_data = true should be shown in rankings.
    columns:
      - name: buyer_id
        data_tests: [not_null, unique]
      - name: evaluated_processes
        data_tests: [not_null, positive]


  - name: indicator_r003_short_period
    description: >
      R003 Short submission period (OCP Cardinal). One row per evaluated process
      (competitive method, tender start and end known, procedure type with enough
      processes). A risk signal, not evidence of wrongdoing.
      See docs/indicators/r003-short-period.md.
    columns:
      - name: ocid
        data_tests: [not_null, unique]
      - name: procurement_method
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('r003_procurement_methods') }}"
      - name: tender_days
        data_tests: [not_null]
      - name: flagged
        data_tests: [not_null]

  - name: buyer_r003_summary
    description: >
      Short-period rate per buyer, with the expected rate for its procedure types
      (leave-one-out). Only buyers with enough_data = true should be ranked.
    columns:
      - name: buyer_id
        data_tests: [not_null, unique]
      - name: evaluated_processes
        data_tests: [not_null, positive]


  - name: indicator_lp01_supplier_concentration
    description: >
      LP01 Unusual supplier concentration (own indicator). One row per buyer and CPC
      division with enough awards: the top supplier, its share of the buyer's awards,
      and how often it wins from comparable buyers (leave-one-out). A risk signal, not
      evidence of wrongdoing. See docs/indicators/lp01-supplier-concentration.md.
    data_tests:
      - unique:
          arguments:
            column_name: "buyer_id || '|' || cpc_division"
    columns:
      - name: supplier_key
        data_tests: [not_null]
      - name: top_share
        data_tests: [not_null, positive]
      - name: flagged
        data_tests: [not_null]


  - name: price_reference_groups
    description: >
      Reference prices per group of comparable items (same 9-digit CPC code and unit),
      from the median of each buyer's median price. `usable` groups have enough buyers
      and items and a small spread between buyers.
    data_tests:
      - unique:
          arguments:
            column_name: "cpc_code || '|' || unit_name"
    columns:
      - name: reference_price
        data_tests: [not_null, positive]

  - name: indicator_lp02_unit_price
    description: >
      LP02 Unusually high unit price (own indicator). One row per item in a usable
      reference group. `price_difference` is a difference against the typical price,
      not a proven overpayment. See docs/indicators/lp02-unit-price.md.
    data_tests:
      - unique:
          arguments:
            column_name: "ocid || '|' || award_id || '|' || item_index"
    columns:
      - name: price_ratio
        data_tests: [not_null, positive]
      - name: flagged
        data_tests: [not_null]

unit_tests:
  - name: r018_buyers_are_compared_with_others_only
    description: >
      Leave-one-out baselines: each buyer's expected rate comes from OTHER buyers'
      processes of the same procedure type and CPC division, falling back to the
      procedure type when the CPC group is too small.
    model: buyer_r018_summary
    overrides:
      vars:
        r018_min_baseline: 2
        r018_min_processes: 1
    given:
      - input: ref('indicator_r018_single_bid')
        rows:
          # Buyer A: 2 processes in (Subasta, CPC 43), both single bid.
          - {buyer_id: A, buyer_name: A, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: true}
          - {buyer_id: A, buyer_name: A, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: true}
          # Buyer B: 4 processes in the same group, 1 single bid.
          - {buyer_id: B, buyer_name: B, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: true}
          - {buyer_id: B, buyer_name: B, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: false}
          - {buyer_id: B, buyer_name: B, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: false}
          - {buyer_id: B, buyer_name: B, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "43", flagged: false}
          # Buyer C: alone in (Subasta, CPC 28), so it falls back to the procedure type.
          - {buyer_id: C, buyer_name: C, source_month: "2025-01", procurement_method_details: Subasta, main_cpc_division: "28", flagged: false}
    expect:
      rows:
        # A vs B's group rate 1/4: expected 0.5, observed 2 -> 4x.
        - {buyer_id: A, single_bid_processes: 2, expected_rate: 0.25, observed_to_expected: 4.0, cpc_baseline_share: 1.0}
        # B vs A's group rate 2/2: expected 4, observed 1 -> 0.25x.
        - {buyer_id: B, single_bid_processes: 1, expected_rate: 1.0, observed_to_expected: 0.25, cpc_baseline_share: 1.0}
        # C: no other buyer in CPC 28 -> type rate from A and B, 3/6.
        - {buyer_id: C, single_bid_processes: 0, expected_rate: 0.5, observed_to_expected: 0.0, cpc_baseline_share: 0.0}

  - name: r003_days_are_complete_24h_periods_below_type_percentile
    description: >
      R003 counts complete 24-hour days (17:00 -> 10:00 four dates later is 3 days)
      and flags processes strictly below the percentile of their procedure type.
      Procedure types with too few processes are not evaluated.
    model: indicator_r003_short_period
    overrides:
      vars:
        r003_min_group: 4
        r003_percentile: 0.25
    given:
      - input: ref('processes')
        rows:
          - {ocid: a, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 17:00:00-05", tender_period_end: "2025-01-10 10:00:00-05"}
          - {ocid: b, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-16 09:00:00-05"}
          - {ocid: c, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-18 09:00:00-05"}
          - {ocid: d, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-20 09:00:00-05"}
          - {ocid: e, procurement_method: open, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-21 09:00:00-05"}
          # Only 1 process of this type: not evaluated.
          - {ocid: f, procurement_method: open, procurement_method_details: Cotización, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-07 09:00:00-05"}
          # Direct award: never evaluated.
          - {ocid: g, procurement_method: direct, procurement_method_details: Licitación, tender_period_start: "2025-01-06 09:00:00-05", tender_period_end: "2025-01-07 09:00:00-05"}
    expect:
      rows:
        - {ocid: a, tender_days: 3, threshold_days: 10, flagged: true}
        - {ocid: b, tender_days: 10, threshold_days: 10, flagged: false}
        - {ocid: c, tender_days: 12, threshold_days: 10, flagged: false}
        - {ocid: d, tender_days: 14, threshold_days: 10, flagged: false}
        - {ocid: e, tender_days: 15, threshold_days: 10, flagged: false}

  - name: r003_significance_needs_evidence_beyond_chance
    description: >
      Buyer A has 14 short periods where about 0.4 are expected: significant.
      Buyer B has 1 where 60 are expected: not significant. Buyer C has too few
      processes to be ranked. Uses the fallback to all other buyers for B, whose
      procedure type has fewer than 30 processes from other buyers.
    model: buyer_r003_summary
    overrides:
      vars:
        r003_min_processes: 20
        r003_min_baseline: 30
        fdr_alpha: 0.05
        min_flagged_for_significance: 3
    given:
      - input: ref('indicator_r003_short_period')
        format: sql
        rows: |
          select
              'p' || buyer || i as ocid, '2025-01' as source_month, buyer as buyer_id,
              buyer as buyer_name, null::varchar as buyer_region, 'open' as procurement_method,
              'Licitación' as procurement_method_details,
              null::timestamptz as tender_period_start, null::timestamptz as tender_period_end,
              10 as tender_days, 8 as threshold_days, 14.0 as group_median_days,
              125 as group_processes, i <= short as flagged
          from (values ('A', 20, 14), ('B', 100, 1), ('C', 5, 1)) as b(buyer, n, short),
               range(1, n + 1) as r(i)
    expect:
      rows:
        - {buyer_id: A, short_period_processes: 14, enough_data: true, significant: true}
        - {buyer_id: B, short_period_processes: 1, enough_data: true, significant: false}
        - {buyer_id: C, short_period_processes: 1, enough_data: false, significant: false}

  - name: r003_two_events_are_never_significant
    description: >
      Buyer E has 2 short periods where other buyers have none (expected 0, so the
      Poisson probability is 0), but two events are below min_flagged_for_significance.
    model: buyer_r003_summary
    overrides:
      vars:
        r003_min_processes: 20
        r003_min_baseline: 30
        fdr_alpha: 0.05
        min_flagged_for_significance: 3
    given:
      - input: ref('indicator_r003_short_period')
        format: sql
        rows: |
          select
              'p' || buyer || i as ocid, '2025-01' as source_month, buyer as buyer_id,
              buyer as buyer_name, null::varchar as buyer_region, 'open' as procurement_method,
              'Cotización' as procurement_method_details,
              null::timestamptz as tender_period_start, null::timestamptz as tender_period_end,
              10 as tender_days, 8 as threshold_days, 14.0 as group_median_days,
              220 as group_processes, i <= short as flagged
          from (values ('E', 20, 2), ('F', 200, 0)) as b(buyer, n, short),
               range(1, n + 1) as r(i)
    expect:
      rows:
        - {buyer_id: E, short_period_processes: 2, p_value: 0.0, enough_data: true, significant: false}
        - {buyer_id: F, short_period_processes: 0, p_value: 1.0, enough_data: true, significant: false}

  - name: lp01_favourite_supplier_vs_market_leader
    description: >
      Buyer A gives 8 of 10 awards to supplier X, which comparable buyers do not use,
      in a category where buyers usually spread their awards: flagged. Buyer B spreads
      its awards: not flagged. Buyers C and D buy everything from Y, which every buyer
      uses (a market leader or sole provider): not flagged. Buyers E, F and G each use
      one local supplier for everything, as is usual in that category: not flagged.
    model: indicator_lp01_supplier_concentration
    overrides:
      vars:
        lp01_min_awards: 10
        lp01_min_top_share: 0.5
        lp01_min_baseline: 30
        lp01_min_peer_cells: 1
        fdr_alpha: 0.05
        min_flagged_for_significance: 3
    given:
      - input: ref('int_buyer_supplier_wins')
        format: sql
        rows: |
          select buyer_id, buyer_id as buyer_name, 'P' as buyer_region, cpc_division,
                 supplier_key, 'private_company' as supplier_type,
                 supplier_key as supplier_name, wins::decimal(18, 4) as wins,
                 (wins * 1000)::decimal(18, 2) as awarded_amount
          from (values
              ('A', '43', 'X', 8), ('A', '43', 'Z1', 2),
              ('B', '43', 'Z1', 5), ('B', '43', 'Z2', 5), ('B', '43', 'Z3', 5),
              ('B', '43', 'Z4', 5), ('B', '43', 'Z5', 5), ('B', '43', 'Z6', 5),
              ('B', '43', 'Z7', 5), ('B', '43', 'Z8', 5),
              ('C', '17', 'Y', 10), ('D', '17', 'Y', 40),
              ('E', '63', 'E1', 10), ('F', '63', 'F1', 10), ('G', '63', 'G1', 10)
          ) as t(buyer_id, cpc_division, supplier_key, wins)
    expect:
      rows:
        - {buyer_id: A, cpc_division: "43", supplier_key: X, top_share: 0.8, flagged: true}
        - {buyer_id: B, cpc_division: "43", supplier_key: Z1, top_share: 0.125, flagged: false}
        - {buyer_id: C, cpc_division: "17", supplier_key: Y, top_share: 1.0, flagged: false}
        - {buyer_id: D, cpc_division: "17", supplier_key: Y, top_share: 1.0, flagged: false}
        - {buyer_id: E, cpc_division: "63", supplier_key: E1, top_share: 1.0, flagged: false}
        - {buyer_id: F, cpc_division: "63", supplier_key: F1, top_share: 1.0, flagged: false}
        - {buyer_id: G, cpc_division: "63", supplier_key: G1, top_share: 1.0, flagged: false}

  - name: lp02_flags_only_clear_outliers_in_comparable_groups
    description: >
      Group G (5 buyers paying about 10) is usable: an item at 40 (4x) is flagged, one
      at 25 (2.5x) is not. Group H has buyers paying from 1 to 100 (different products
      under one code): not usable, so its items are not evaluated at all.
    model: indicator_lp02_unit_price
    overrides:
      vars:
        lp02_min_ratio: 3
        lp02_min_robust_z: 3.5
    given:
      - input: ref('int_comparable_items')
        format: sql
        rows: |
          select ocid, 'a' as award_id, 1 as item_index, buyer_id, buyer_id as buyer_name,
                 'P' as buyer_region, '2025-01' as source_month,
                 'Licitación' as procurement_method_details, cpc_code, 'UNIDAD' as unit_name,
                 1.0::decimal(18, 4) as quantity, price::decimal(18, 4) as unit_price,
                 ln(price) as log_price
          from (values
              ('g1', 'B1', '111', 9.0), ('g2', 'B2', '111', 10.0), ('g3', 'B3', '111', 10.0),
              ('g4', 'B4', '111', 11.0), ('g5', 'B5', '111', 40.0), ('g6', 'B5', '111', 25.0),
              ('h1', 'B1', '222', 1.0), ('h2', 'B2', '222', 100.0)
          ) as t(ocid, buyer_id, cpc_code, price)
      - input: ref('price_reference_groups')
        format: sql
        rows: |
          select '111' as cpc_code, 'UNIDAD' as unit_name, 6::bigint as items,
                 5::bigint as buyers, 10.0 as reference_price, ln(10.0) as reference_log_price,
                 0.1 as log_mad, 1.3 as spread, true as usable
          union all
          select '222', 'UNIDAD', 2, 2, 10.0, ln(10.0), 2.3, 100.0, false
    expect:
      rows:
        - {ocid: g1, flagged: false}
        - {ocid: g2, flagged: false}
        - {ocid: g3, flagged: false}
        - {ocid: g4, flagged: false}
        - {ocid: g5, flagged: true}
        - {ocid: g6, flagged: false}

  - name: price_reference_is_not_set_by_the_biggest_buyer
    description: >
      Four buyers pay 10 once each; one buyer pays 100 for 50 items. The reference
      price is 10: each buyer counts once. Spread is large but the group still has a
      clear reference; with spread above the maximum it is marked not usable.
    model: price_reference_groups
    overrides:
      vars:
        lp02_min_buyers: 5
        lp02_min_items: 10
        lp02_max_spread: 5
    given:
      - input: ref('int_comparable_items')
        format: sql
        rows: |
          select 'o' || buyer_id || i as ocid, 'a' as award_id, 1 as item_index, buyer_id,
                 buyer_id as buyer_name, 'P' as buyer_region, '2025-01' as source_month,
                 'Licitación' as procurement_method_details, '111' as cpc_code,
                 'UNIDAD' as unit_name, 1.0::decimal(18, 4) as quantity,
                 price::decimal(18, 4) as unit_price, ln(price) as log_price
          from (values ('B1', 1, 10.0), ('B2', 1, 10.0), ('B3', 1, 10.0), ('B4', 1, 10.0),
                       ('BIG', 50, 100.0)) as t(buyer_id, n, price),
               range(1, n + 1) as r(i)
    expect:
      rows:
        - {cpc_code: "111", unit_name: UNIDAD, items: 54, buyers: 5, reference_price: 10.0}
