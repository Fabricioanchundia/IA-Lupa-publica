name: lupa_publica
version: "0.1.0"
config-version: 2
profile: lupa_publica

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lupa_publica:
    staging:
      # Parsing the raw JSON is the expensive part, so it happens once, into tables.
      +materialized: table
      +schema: silver
    intermediate:
      +materialized: table
      +schema: silver
    silver:
      +materialized: table
      +schema: silver
    gold:
      # Risk indicators and aggregates. Signals to prioritize review, never accusations.
      +materialized: table
      +schema: gold

vars:
  # R018 Single bid received: competitive methods evaluated (Cardinal default: open|selective).
  r018_procurement_methods: ["open", "selective"]
  # A buyer's single-bid rate is only reliable with enough evaluated processes.
  r018_min_processes: 20
  # Minimum processes from OTHER buyers for a comparison group (baseline) to be used.
  r018_min_baseline: 30
  # R003 Short submission period: competitive methods evaluated.
  r003_procurement_methods: ["open", "selective"]
  # "Short" = below this percentile of the same procedure type (no legal minimums loaded yet).
  r003_percentile: 0.05
  # A procedure type needs this many processes for its percentile to be meaningful.
  r003_min_group: 100
  r003_min_processes: 20
  r003_min_baseline: 30
  # Buyer summaries: flag as significant when the false discovery rate q-value is below this.
  fdr_alpha: 0.05
  # One or two events never make a pattern, however unlikely they look.
  min_flagged_for_significance: 3

seeds:
  lupa_publica:
    +schema: silver

flags:
  # No usage telemetry: this project is about public data, not about its users.
  send_anonymous_usage_stats: false
