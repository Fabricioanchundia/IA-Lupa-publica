name: lupa_publica
version: "0.1.0"
config-version: 2
profile: lupa_publica

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lupa_publica:
    staging:
      # Parsing the raw JSON is the expensive part, so it happens once, into tables.
      +materialized: table
      +schema: silver
    intermediate:
      +materialized: table
      +schema: silver
    silver:
      +materialized: table
      +schema: silver
    gold:
      # Risk indicators and aggregates. Signals to prioritize review, never accusations.
      +materialized: table
      +schema: gold

vars:
  # R018 Single bid received: competitive methods evaluated (Cardinal default: open|selective).
  r018_procurement_methods: ["open", "selective"]
  # A buyer's single-bid rate is only reliable with enough evaluated processes.
  r018_min_processes: 20
  # Minimum processes from OTHER buyers for a comparison group (baseline) to be used.
  r018_min_baseline: 30

seeds:
  lupa_publica:
    +schema: silver

flags:
  # No usage telemetry: this project is about public data, not about its users.
  send_anonymous_usage_stats: false
