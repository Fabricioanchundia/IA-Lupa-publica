name: refresh

# The monthly robot (Phase 10, ADR-0010). It downloads the last 24 complete months from
# SERCOP, rebuilds silver and gold with dbt (data tests and the privacy test included),
# exports the public datasets, compares them with the data on the website and, if they
# look right, publishes a new data-* release and rebuilds the website.
#
# Cost: free. GitHub Actions has no minute limit for public repositories.
# Needs the repository secret LUPA_PSEUDONYM_KEY (the same key as in your .env).
on:
  schedule:
    - cron: "23 11 3 * *" # day 3 of every month at 11:23 UTC (06:23 in Ecuador)
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the new data on the website (untick for a test run)"
        type: boolean
        default: false

permissions:
  contents: write # create the data-* release
  actions: write # start the pages workflow

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LUPA_PSEUDONYM_KEY: ${{ secrets.LUPA_PSEUDONYM_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked

      - name: Check that the pseudonym key is set
        run: |
          if [ -z "$LUPA_PSEUDONYM_KEY" ]; then
            echo "::error::Add the secret LUPA_PSEUDONYM_KEY (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      # Every run starts from an empty machine, so the whole window is downloaded again.
      # That is also the "periodic full refresh" ADR-0001 left for later: older months are
      # regenerated by SERCOP too. If one month fails, the step fails and nothing is published.
      - name: Download SERCOP data (last 24 complete months)
        run: |
          first_day=$(date -u +%Y-%m-01)
          start=$(date -u -d "$first_day -24 months" +%Y-%m)
          end=$(date -u -d "$first_day -1 month" +%Y-%m)
          echo "Window: $start to $end"
          uv run lupa backfill --from "$start" --to "$end"
          du -sh data/raw data/bronze

      - name: Build silver and gold (with data tests)
        run: uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Export the public datasets
        run: uv run lupa export-public

      - name: Compare with the data on the website
        run: |
          mkdir -p previous
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
                --jq '[.[] | select(.tagName | startswith("data-"))][0].tagName')
          if [ -n "$tag" ]; then
            echo "Comparing with $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.csv.gz' --dir previous
          fi
          uv run lupa check-release --previous previous --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish the release and rebuild the website
        if: github.event_name == 'schedule' || inputs.publish
        run: bash scripts/publish_data.sh
